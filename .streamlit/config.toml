[theme]
base = "light"
primaryColor = "#B4441C"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F1EEE8"
textColor = "#1F1D1A"
linkColor = "#B4441C"
borderColor = "#E3DED4"
showWidgetBorder = true
baseRadius = "4px"
buttonRadius = "4px"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 500, 500, 500]
chartCategoricalColors = ["#B4441C", "#3D5A6C", "#8A9A5B", "#C9A227", "#6B4E71"]

[client]
toolbarMode = "minimal"
